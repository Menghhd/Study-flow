
name: Build StudyFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 获取仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 解压项目 ZIP
      - name: Extract project
        run: |
          mkdir -p build-src
          unzip -q StudyFlow-Cloud-Build.zip -d build-src

      # 3. 查找 Android 项目
      - name: Find Android project
        run: |
          PROJECT_FILE=$(find build-src -name settings.gradle.kts -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            find build-src -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project: $PROJECT_DIR"

      # 4. 安装 Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 5. 安装 Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. 修复 Java 和 Kotlin JVM 版本
      - name: Fix JVM target
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          gradle_file = project / "app" / "build.gradle.kts"

          content = gradle_file.read_text(encoding="utf-8")

          java_config = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """

          if re.search(r'compileOptions\s*\{', content):
              content = re.sub(
                  r'compileOptions\s*\{[^}]*\}',
                  java_config.strip(),
                  content,
                  count=1
              )
          else:
              content = content.replace(
                  "android {",
                  "android {\n" + java_config,
                  1
              )

          kotlin_config = """
              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          if re.search(r'kotlinOptions\s*\{', content):
              content = re.sub(
                  r'kotlinOptions\s*\{[^}]*\}',
                  kotlin_config.strip(),
                  content,
                  count=1
              )
          else:
              content = content.replace(
                  "android {",
                  "android {\n" + kotlin_config,
                  1
              )

          gradle_file.write_text(content, encoding="utf-8")
          print("JVM target fixed to 17")
          PY

      # 7. 修复 Material3 实验性 API
      - name: Fix Material3 Experimental API
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          source = project / "app/src/main/java/com/example/studyflow/MainActivity.kt"

          content = source.read_text(encoding="utf-8")

          annotation = (
              "@file:OptIn("
              "androidx.compose.material3.ExperimentalMaterial3Api::class"
              ")"
          )

          if annotation not in content:
              content = annotation + "\n" + content
              source.write_text(content, encoding="utf-8")

          print("Material3 API opt-in added")
          PY

      # 8. 编译 APK
      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" --no-daemon :app:assembleDebug

      # 9. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
