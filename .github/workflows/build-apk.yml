
name: Build StudyFlow APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q StudyFlow-Cloud-Build.zip -d build-src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd build-src/StudyFlow
          gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-APK
          path: build-src/StudyFlow/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
